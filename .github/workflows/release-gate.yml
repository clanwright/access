name: Release gate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch protected main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify release metadata and provenance
        run: nix develop --no-write-lock-file --command python3 scripts/verify-release.py --tag "$GITHUB_REF_NAME"
      - name: Run complete verification
        run: bash scripts/verify.sh
      - name: Generate freshness metadata
        run: nix run --no-write-lock-file .#freshness-report -- --output access-freshness.json
      - name: Upload release freshness metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: access-freshness
          path: access-freshness.json
          if-no-files-found: error
          retention-days: 30

  native-arm-darwin:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build native recovery dependencies and parse client config
        run: bash scripts/verify.sh --native-recovery

  verify:
    needs: [linux, native-arm-darwin]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both platform gates
        run: |
          test "${{ needs.linux.result }}" = success
          test "${{ needs.native-arm-darwin.result }}" = success
